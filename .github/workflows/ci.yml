name: Validar cambios

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - test
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "resources/screenshots/**"
  push:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "resources/screenshots/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validar en Windows
    runs-on: windows-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar Electron
        run: npm rebuild electron --force && npx electron --version

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Compilar aplicación
        run: npm run build
