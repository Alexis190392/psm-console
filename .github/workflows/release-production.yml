name: Publicar versión estable

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "resources/screenshots/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  artifacts:
    name: Generar versiones estables
    runs-on: windows-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar Electron
        run: npm rebuild electron --force && npx electron --version

      - name: Leer versión de la aplicación
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validar código
        run: npm run typecheck && npm run lint && npm test

      - name: Generar portable
        run: npm run dist:portable

      - name: Generar instalable multiservidor
        run: npm run dist:multi

      - name: Publicar artefacto estable
        uses: actions/upload-artifact@v4
        with:
          name: PSM-Console
          path: release/PSM-Console-*.exe
          if-no-files-found: error

      - name: Crear release estable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: PSM Console v${{ env.VERSION }}
          generate_release_notes: true
          files: release/PSM-Console-*.exe
