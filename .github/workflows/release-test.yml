name: Publicar versión de prueba

on:
  workflow_dispatch:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  portable:
    name: Generar portable de prueba
    runs-on: windows-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Leer versión de la aplicación
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validar código
        run: npm run typecheck && npm run lint && npm test

      - name: Generar portable
        run: npm run dist:portable

      - name: Publicar artefacto de prueba
        uses: actions/upload-artifact@v4
        with:
          name: PSM-Console-portable-test
          path: release/*Portable*.exe
          if-no-files-found: error

      - name: Crear prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-test.${{ github.run_number }}
          name: PSM Console v${{ env.VERSION }} - prueba ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: release/*Portable*.exe
