<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PSM Console</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;
      }

      .splash {
        position: relative;
        width: 208px;
        height: 208px;
        display: grid;
        place-items: center;
      }

      .splash::before {
        content: '';
        position: absolute;
        inset: 10px;
        border: 2px solid rgba(10, 213, 234, 0.16);
        border-top-color: #0ad5ea;
        border-radius: 50%;
        animation: loading 1.15s linear infinite;
      }

      .splash__logo {
        width: 164px;
        height: 164px;
        object-fit: contain;
        filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.42));
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes loading {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(0.97);
          opacity: 0.9;
        }

        50% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash::before,
        .splash__logo {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="splash" aria-label="Iniciando PSM Console">
      <img class="splash__logo" src="./assets/palcm-logo.png" alt="" />
    </main>
  </body>
</html>
