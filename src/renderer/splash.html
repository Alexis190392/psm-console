<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PSM Console</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;
      }

      .splash {
        position: relative;
        width: 228px;
        height: 176px;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 4px;
        animation: splash-enter 320ms ease-out both;
      }

      .splash::before {
        content: none;
      }

      .splash::after {
        content: '';
        position: absolute;
        left: 59px;
        right: 59px;
        bottom: 18px;
        height: 2px;
        background: linear-gradient(90deg, transparent, #08d9e8, #ff2b7f, transparent);
        background-size: 200% 100%;
        box-shadow:
          0 0 8px rgba(8, 217, 232, 0.3),
          0 0 8px rgba(255, 43, 127, 0.18);
        animation: loading 1.15s linear infinite;
      }

      .splash__logo {
        position: relative;
        width: 220px;
        height: 132px;
        object-fit: contain;
        filter:
          drop-shadow(-2px 0 5px rgba(8, 217, 232, 0.32))
          drop-shadow(-2px 0 13px rgba(8, 217, 232, 0.16))
          drop-shadow(2px 0 5px rgba(255, 43, 127, 0.3))
          drop-shadow(2px 0 13px rgba(255, 43, 127, 0.15));
        animation: logo-pulse 1.6s ease-in-out infinite;
      }

      .splash__status {
        position: relative;
        margin-top: -14px;
        font: 600 9px/1.2 Consolas, "Courier New", monospace;
        letter-spacing: 1.4px;
        color: #9cf6ff;
        text-shadow: 0 0 8px rgba(8, 217, 232, 0.45);
      }

      .splash__status::after {
        content: '';
        display: inline-block;
        width: 12px;
        margin-left: 4px;
        animation: status-dots 1.2s steps(4, end) infinite;
      }

      @keyframes splash-enter {
        from {
          opacity: 0;
          transform: scale(0.94);
        }

        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      body.splash-exit .splash {
        animation: splash-leave 320ms cubic-bezier(0.4, 0, 1, 1) both;
      }

      @keyframes splash-leave {
        from {
          opacity: 1;
          transform: scale(1);
        }

        to {
          opacity: 0;
          transform: scale(0.96);
        }
      }

      @keyframes loading {
        to {
          background-position: -200% 0;
        }
      }

      @keyframes logo-pulse {
        0%,
        100% {
          transform: scale(0.985);
          opacity: 0.88;
        }

        50% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes status-dots {
        0% {
          content: '';
        }

        25% {
          content: '.';
        }

        50% {
          content: '..';
        }

        75%,
        100% {
          content: '...';
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash,
        body.splash-exit .splash,
        .splash::before,
        .splash::after,
        .splash__logo,
        .splash__status::after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="splash" aria-label="Iniciando PSM Console">
      <img class="splash__logo" src="./assets/palcm-logo.png" alt="" />
      <span class="splash__status">INICIANDO SISTEMAS</span>
    </main>
  </body>
</html>
